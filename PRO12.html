.ef-box input,.ef-box select{padding:9px;border:2px solid #1b5e20;border-radius:6px;margin:4px}
.ef-btn{padding:9px 16px;border:none;border-radius:8px;background:#1b5e20;color:#fff;cursor:pointer;margin:4px}
.ef-err{color:#c62828;font-size:.9rem;min-height:1.1em}
.ef-box input{width:50%}.ef-data{text-align:left;margin-top:10px}
  </style>
  <script>
function getDriver() {
  var id = document.getElementById("driverId").value.trim();
  var status = document.getElementById("ef-status");
  var out = document.getElementById("ef-data");
  out.innerHTML = "";
  status.textContent = "";
  if (id == "" || !/^[0-9]+$/.test(id) || Number(id) < 1 || Number(id) > 10) {
    status.textContent = "Please enter a number between 1 and 10.";
    return;
  }
  status.style.color = "#1b3a1b";
  status.textContent = "Loading...";
  console.log("Requesting driver:", id);               // debugging
  fetch("https://jsonplaceholder.typicode.com/users/" + id)
    .then(function (res) {
      console.log("Response status:", res.status);     // debugging
      if (!res.ok) { throw new Error("Server error " + res.status); }
      return res.json();
    })
    .then(function (d) {
      console.log("Data received:", d);
      status.textContent = "";
      out.innerHTML = "<b>" + d.name + "</b><br>Email: " + d.email + "<br>Phone: " + d.phone + "<br>City: " + d.address.city;
    })
    .catch(function (err) {
      console.error("Fetch failed:", err);
      status.style.color = "#c62828";
      status.textContent = "Could not load data: " + err.message;
    });
}
</script>
